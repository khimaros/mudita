<?xml version="1.0" encoding="UTF-8"?>
<!-- mudita.svg for launchers that cut the icon to a shape of their own: the
     background fills the square and the drawing keeps to the middle 80%. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#121318"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <circle cx="256" cy="256" r="184" fill="none" stroke="#3584e4" stroke-width="22" opacity="0.3"/>
    <circle cx="256" cy="256" r="120" fill="none" stroke="#3584e4" stroke-width="26" opacity="0.6"/>
    <circle cx="256" cy="256" r="58" fill="#3584e4"/>
  </g>
</svg>
